server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/forum?serverTimezone=Asia/Tokyo&useUnicode=true&characterEncoding=utf8mb4}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  jackson:
    time-zone: Asia/Tokyo

logging:
  level:
    org.example.project: INFO

myforum:
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-1234567890}
    issuer: myforum
    access-token-expires-in-seconds: ${JWT_ACCESS_TTL:900}
    refresh-token-expires-in-seconds: ${JWT_REFRESH_TTL:604800}
