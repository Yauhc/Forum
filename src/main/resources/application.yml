server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/forum?serverTimezone=Asia/Tokyo&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-test-query: SELECT 1
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  jackson:
    time-zone: Asia/Tokyo
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:db/migration/V001__ensure_user_timestamps.sql

logging:
  level:
    org.example.project: INFO

myforum:
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-1234567890}
    issuer: myforum
    access-token-expires-in-seconds: ${JWT_ACCESS_TTL:900}
    refresh-token-expires-in-seconds: ${JWT_REFRESH_TTL:604800}
